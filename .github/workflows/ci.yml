# CI: validates, deploys and runs the training in `staging` on every PR to `main`
name: CI - staging

on:
  workflow_dispatch:
  pull_request:
    branches: ['main']

# One run at a time per target; the next one waits in the queue so a deploy in progress is not interrupted
concurrency:
  group: ${{ github.workflow }}-staging
  cancel-in-progress: false

# OAuth M2M of the CI/CD service principal
env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
  DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@v1.17.0
      - name: Validate bundle
        run: databricks bundle validate --target staging
      - name: Deploy bundle
        run: databricks bundle deploy --target staging
      # Waits for the job to finish; fails the workflow if the run fails
      - name: Run training
        run: databricks bundle run --target staging fraud_training
